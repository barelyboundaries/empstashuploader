[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-megapack-backend"
version = "0.1.0"
description = "Stash-to-Empornium Megapack generator backend (DeepSeek track)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic-settings>=2.6",
    "pillow>=12",
    "httpx>=0.27",
    "torf>=4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "torf>=4.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["deepseek_megapack*"]
exclude = ["tests*"]
